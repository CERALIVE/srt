name: ABI checks

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SRT_BASE: srt-v1.5.6+ceralive.1

jobs:
  build_pr:
    name: Build current version
    runs-on: ubuntu-latest

    outputs:
       base_version: ${{ steps.build.outputs.SRT_BASE }}
       tag_version: ${{ steps.build.outputs.SRT_TAG_VERSION }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: gitview_pr
    - name: Configure ccache environment
      run: echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
    - name: Restore ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/ccache
        key: srt-ccache-abi-current-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gitview_pr/CMakeLists.txt', 'gitview_pr/cmake_object_lib_support.c', 'gitview_pr/apps/**', 'gitview_pr/common/**', 'gitview_pr/haicrypt/**', 'gitview_pr/scripts/**', 'gitview_pr/srtcore/**', 'gitview_pr/test/**', 'gitview_pr/testing/**') }}
        restore-keys: srt-ccache-abi-current-${{ runner.os }}-${{ runner.arch }}-
    - name: Set up ccache
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ccache
        ccache --max-size=200M
        ccache --zero-stats
    - id: configure
      name: Configure (cmake)
      run: |
        cd gitview_pr
        mkdir _build && cd _build
        cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DENABLE_BONDING=1 -DENABLE_PKTINFO=1 -DENABLE_MAXREXMITBW=1 ../
    - id: build
      name: Build and dump
      run: |
        sudo apt install -y abi-dumper abi-compliance-checker tcl
        cd gitview_pr
        cd _build && cmake --build ./
        make install DESTDIR=./installdir
        SRT_TAG_VERSION=v$(../scripts/get-build-version.tcl full)
        echo "SRT_TAG_VERSION=$SRT_TAG_VERSION" >> "$GITHUB_OUTPUT"
        SRT_TAG=${SRT_TAG_VERSION}dev-$(git rev-parse --short HEAD)
        echo "TAGGING PR BUILD: $SRT_TAG"
        abi-dumper libsrt.so -o libsrt-pr.dump -public-headers installdir/usr/local/include/srt/ -lver "$SRT_TAG"
        ls -ld libsrt-pr.dump
        sha256sum libsrt-pr.dump
        echo "WILL CHECK ABI changes ${SRT_BASE} - ${SRT_TAG_VERSION}"
        echo "SRT_BASE=${SRT_BASE}" >> "$GITHUB_OUTPUT"
    - name: Save ccache
      if: ${{ success() && github.event_name != 'pull_request' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/ccache
        key: srt-ccache-abi-current-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gitview_pr/CMakeLists.txt', 'gitview_pr/cmake_object_lib_support.c', 'gitview_pr/apps/**', 'gitview_pr/common/**', 'gitview_pr/haicrypt/**', 'gitview_pr/scripts/**', 'gitview_pr/srtcore/**', 'gitview_pr/test/**', 'gitview_pr/testing/**') }}
    - name: Show ccache statistics
      if: always()
      run: ccache --show-stats
    - id: upload_pr_dump
      uses: actions/upload-artifact@v7
      with:
        name: abidump_pr
        path: gitview_pr/_build/libsrt-pr.dump

  build_base:
    name: Build base version
    runs-on: ubuntu-latest
    needs: build_pr
    if: ${{ needs.build_pr.outputs.base_version != '' }}

    env:
      SRT_BASE: ${{ needs.build_pr.outputs.base_version }}
      SRT_TAG_VERSION: ${{ needs.build_pr.outputs.tag_version }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: gitview_base
        ref: ${{ env.SRT_BASE }}
    - name: Configure ccache environment
      run: echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
    - name: Restore ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/ccache
        key: srt-ccache-abi-base-${{ runner.os }}-${{ runner.arch }}-${{ env.SRT_BASE }}-${{ hashFiles('gitview_base/CMakeLists.txt', 'gitview_base/cmake_object_lib_support.c', 'gitview_base/apps/**', 'gitview_base/common/**', 'gitview_base/haicrypt/**', 'gitview_base/scripts/**', 'gitview_base/srtcore/**', 'gitview_base/test/**', 'gitview_base/testing/**') }}
        restore-keys: srt-ccache-abi-base-${{ runner.os }}-${{ runner.arch }}-${{ env.SRT_BASE }}-
    - name: Set up ccache
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ccache
        ccache --max-size=200M
        ccache --zero-stats
    - id: configure_tag
      name: Configure (cmake)
      run: |
        echo "TAG:$SRT_TAG_VERSION BASE:$SRT_BASE"

        #This is currently a paranoid check - the if should do the job
        if [[ -z $SRT_BASE ]]; then
            echo "NO BASE DEFINED. NOT BUILDING"
            exit 1
        fi
        cd gitview_base
        mkdir _build && cd _build
        cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DENABLE_BONDING=1 -DENABLE_PKTINFO=1 -DENABLE_MAXREXMITBW=1 ../
    - id: build_tag
      name: Build and dump
      if: ${{ success() }}
      run: |
        sudo apt install -y abi-dumper
        sudo apt install -y tcl
        cd gitview_base      
        cd _build && cmake --build ./
        make install DESTDIR=./installdir
        echo "TAGGING BASE BUILD: $SRT_BASE"
        abi-dumper libsrt.so -o libsrt-base.dump -public-headers installdir/usr/local/include/srt/ -lver "$SRT_BASE"
        ls -ld libsrt-base.dump
        sha256sum libsrt-base.dump
    - name: Save ccache
      if: ${{ success() && github.event_name != 'pull_request' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/ccache
        key: srt-ccache-abi-base-${{ runner.os }}-${{ runner.arch }}-${{ env.SRT_BASE }}-${{ hashFiles('gitview_base/CMakeLists.txt', 'gitview_base/cmake_object_lib_support.c', 'gitview_base/apps/**', 'gitview_base/common/**', 'gitview_base/haicrypt/**', 'gitview_base/scripts/**', 'gitview_base/srtcore/**', 'gitview_base/test/**', 'gitview_base/testing/**') }}
    - name: Show ccache statistics
      if: always()
      run: ccache --show-stats
    - id: upload_base_dump
      uses: actions/upload-artifact@v7
      with:
        name: abidump_base
        path: gitview_base/_build/libsrt-base.dump

  check_abi:
    name: Compare ABI
    runs-on: ubuntu-latest
    needs: [build_pr, build_base]
    env:
       SRT_BASE: ${{ needs.build_pr.outputs.base_version }}

    steps:
    - name: Download base dump
      uses: actions/download-artifact@v8
      with:
        name: abidump_base
        path: .
    - name: Download pr dump
      uses: actions/download-artifact@v8
      with:
        name: abidump_pr
        path: .
    - name: abi-check
      run: |
        sudo apt install -y abi-dumper abi-compliance-checker tcl
        echo "FILESYSTEM state before running abi-check at $PWD"
        ls -l
        sha256sum libsrt-base.dump
        sha256sum libsrt-pr.dump
        RES=0
        abi-compliance-checker -l libsrt -old libsrt-base.dump -new libsrt-pr.dump || RES=$?
        # Flatten the report for download-preview
        cd compat_reports
        REPORT=$(find . -name *.html)
        cp $REPORT compat_report.html
        cd ..
        if (( $RES != 0 )); then
           echo "ABI/API Compatibility check failed with value $RES"
           echo "RES=$RES" >>$GITHUB_ENV
           exit 0
        fi
    - name: Download report
      uses: actions/upload-artifact@v7
      with:
        name: abi-compliance-report
        path: compat_reports/compat_report.html
        archive: false
    - name: Final result
      run: |
        echo "Final result: $RES"
        exit $RES
